name: Build connectors

on:
  push:
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build MEZ files
        shell: pwsh
        run: |
          foreach ($connector in @('FrappeDocuments', 'FrappeReports')) {
            dotnet msbuild "$connector/$connector.proj" /target:BuildMez /verbosity:minimal /nologo
            if ($LASTEXITCODE -ne 0) {
              throw "Build failed for $connector"
            }
            if (!(Test-Path "$connector/bin/AnyCPU/Debug/$connector.mez" -PathType Leaf)) {
              throw "Missing MEZ output for $connector"
            }
          }

      - name: Bundle MEZ files
        shell: pwsh
        run: |
          Compress-Archive -LiteralPath @(
            'FrappeDocuments/bin/AnyCPU/Debug/FrappeDocuments.mez',
            'FrappeReports/bin/AnyCPU/Debug/FrappeReports.mez'
          ) -DestinationPath 'frappe-power-bi-connectors.zip' -Force

      - name: Upload connector ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: frappe-power-bi-connectors
          path: frappe-power-bi-connectors.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download connector ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: frappe-power-bi-connectors
          path: artifacts

      - name: Attach connector ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            artifacts/frappe-power-bi-connectors.zip \
            --clobber
